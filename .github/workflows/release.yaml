name: 'Panel Release'

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: panel-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build Application'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Installing PNPM'
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.6.0
          runtime: node@26.10.0
          cache: true

      - name: 'Build Application'
        run: 'pnpm run build'
        env:
          API_URL: ${{ secrets.API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

  # Spec 010, RF-33 to RF-37: the image is built into a registry local to the job, scanned there
  # for both platforms and only copied to Docker Hub when the gate passes, keeping the scanned
  # digest, which deploy pins (plan D8). Then one SBOM per platform (D9).
  package:
    name: 'Build, Scan and Publish Image'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    services:
      registry:
        image: registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
        ports:
          - 5000:5000
    env:
      LOCAL: localhost:5000
      GRYPE_REGISTRY_INSECURE_USE_HTTP: 'true'
      SYFT_REGISTRY_INSECURE_USE_HTTP: 'true'
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Project Version'
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Logged in before building only to pull the base images with a quota; nothing is pushed to
      # Docker Hub until the scan gate passes.
      - name: 'Login to Docker Hub'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Host network and plain HTTP so the builder and imagetools reach the job's registry.
      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: 'Build Multi-Platform Image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            API_URL=${{ secrets.API_URL }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          push: true
          tags: ${{ env.LOCAL }}/portfolio-panel:${{ github.sha }}

      - name: 'Download Grype'
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.120.1
          cache-db: true

      - name: 'Download Syft'
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: 'Scan Image'
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          for arch in amd64 arm64; do
            "$GRYPE" "registry:$LOCAL/portfolio-panel:$GITHUB_SHA" --platform "linux/$arch" \
              -o json="grype-$arch.json" -o sarif="grype-$arch.sarif"
          done

      - name: 'Check Findings'
        run: |
          node scripts/sca-gate.mjs \
            --title 'portfolio-panel (linux/amd64)' --report grype-amd64.json \
            --title 'portfolio-panel (linux/arm64)' --report grype-arm64.json

      # One code scanning category per SARIF file: several runs may not share one.
      - name: 'Upload Scan (amd64)'
        if: ${{ always() && hashFiles('grype-amd64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: grype-amd64.sarif
          category: sca-image-panel-amd64

      - name: 'Upload Scan (arm64)'
        if: ${{ always() && hashFiles('grype-arm64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: grype-arm64.sarif
          category: sca-image-panel-arm64

      # imagetools copies the manifest list as is, so Docker Hub gets the scanned digest.
      - name: 'Publish Image'
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$REPOSITORY/portfolio-panel:latest" \
            --tag "$REPOSITORY/portfolio-panel:$VERSION" \
            --tag "$REPOSITORY/portfolio-panel:sha-$GITHUB_SHA" \
            "$LOCAL/portfolio-panel@$DIGEST"
          published=$(docker buildx imagetools inspect "$REPOSITORY/portfolio-panel:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$published" != "$DIGEST" ]; then
            echo "::error::portfolio-panel was published as $published instead of the scanned $DIGEST"
            exit 1
          fi

      - name: 'Generate SBOMs'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p sbom
          for arch in amd64 arm64; do
            "$SYFT" scan "registry:$LOCAL/portfolio-panel@$DIGEST" --platform "linux/$arch" \
              --source-name "$REPOSITORY/portfolio-panel:$VERSION" \
              -o spdx-json="sbom/portfolio-panel-$VERSION-linux-$arch.spdx.json"
          done

      - name: 'Upload SBOMs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-panel-${{ steps.version.outputs.value }}-sbom
          path: sbom/
          if-no-files-found: error

  deploy:
    name: 'Application Deployment'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 'Connecting to Local Network'
        uses: twingate/github-action@358e205bb31e636fef1dfb706228ab60eb90c181 # v1.11
        with:
          service-key: ${{ secrets.LOCAL_NETWORK }}

      - name: 'Deploy Application'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f # v2.1.1
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: set image deployment/panel panel=${{ vars.DOCKERHUB_USERNAME }}/portfolio-panel@${{ needs.package.outputs.digest }} -n portfolio

      - name: 'Verify Deployment'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f # v2.1.1
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: rollout status deployment/panel -n portfolio
